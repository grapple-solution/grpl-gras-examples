apiVersion: grsf.grpl.io/v1alpha1
kind: GrappleApplicationSet
metadata:
  name: grpl-cache-redis-grplcache
  namespace: grpl-cache-redis
spec:
  name: grpl-cache-redis-grplcache
  grapis:
  - name: grpl-cache-redis-grplcache
    spec:
      beimage: grpl/loopback
      beimagetag: 0.3.13
      datasources:
      - name: rediscache
        spec:
          kv-redis:
            db: "0"
            host: $(host)
            name: rediscache
            password: $(password)
            port: $(port)
            url: ""
            #user: $(username)
      discoveredrepos: false
      extraSecrets:
      - grpl-cache-redis-grplcache-redis-account-default
      env:
      - name: host
        value: "grpl-cache-redis-grplcache-redis"
      - name: port
        value: "6379"
      ingress: true
      openapis:
      - name: aladv
        spec:
          url: https://aladv-uat-aladv-uat-aladv-grasfe-grapi.prd.grapple-solutions.com/openapi.json
          prefix: aladv
          client: true
      cacheconfigs:
      - name: aladvcache
        spec:
          openApis: aladv
          redisDS: rediscache
          cacheTTL: 300000
      autoscaling:
        minReplicas: 1
  gruims:
  - name: grpl-cache-redis-grplcache
    spec:
      uiimage: grpl/gruim
      uiimagetag: 0.3.5
      additionalpackages: ""
      config: ""
      style: '{"colors":{"primary":{"DEFAULT":"#004a99","fg":"#ffffff"},"accent":{"DEFAULT":"#fa7252","fg":"#ffffff"}}}'
      autoscaling:
        minReplicas: 1

---
apiVersion: apps.kubeblocks.io/v1
kind: Cluster
metadata:
  name: grpl-cache-redis-grplcache
  namespace: grpl-cache-redis
  annotations:
    helm.sh/resource-policy: keep
spec:
  clusterDef: redis
  topology: standalone
  terminationPolicy: Delete
  componentSpecs:
  - name: redis
    serviceVersion: 7.0.6
    replicas: 1
    schedulingPolicy:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: grpl-cache-redis-grplcache
                topologyKey: kubernetes.io/hostname
      tolerations:
        - key: kb-data
          operator: Equal
          value: 'true'
          effect: NoSchedule
    resources:
      limits:
        cpu: '2'
        memory: 4Gi
      requests:
        cpu: '0.5'
        memory: 0.5Gi
    volumeClaimTemplates:
    - name: data
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
